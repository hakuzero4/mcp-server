[project]
name = "nginxproxy"
version = "0.1.0"
description = "FastMCP server wrapping the Nginx Proxy Manager API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.0.0",
    "httpx>=0.27",
    "pydantic-settings>=2.0",
]

[project.scripts]
nginxproxy = "nginxproxy.server:main"

[build-system]
requires = ["uv_build>=0.8.8,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
