services:
  mcp:
    image: ghcr.io/hakuzero4/mcp-server:latest
    pull_policy: missing
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/data
    environment:
      MCP_SERVER: ${MCP_SERVER:-all}
      MCP_TRANSPORT: ${MCP_TRANSPORT:-http}
      TG_STORE_PATH: /data/tgchannel.sqlite
